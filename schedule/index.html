<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Coach Katy's Schedule | Pickle-Balance</title>
  <meta name="description" content="Upcoming pickleball classes and group lessons with Coach Katy “the” Savage in Daytona Beach.">
  <meta property="og:title" content="Coach Katy's Class & Lesson Schedule">
  <meta property="og:description" content="Upcoming classes, group lessons and open times with Coach Katy “the” Savage.">
  <meta property="og:url" content="https://picklebalance.co/schedule/">
  <link rel="stylesheet" href="../css/style.css">
  <style>
    /* Light by default: plain white page, near-black text. Dark mode only when the phone asks for it. */
    :root {
      --s-bg: #ffffff;
      --s-text: #111111;
      --s-muted: #4a4a4a;
      --s-line: #d9d9d9;
      --s-week-bg: #f1f1f1;
      --s-booked-bg: #e4e4e7;
      --s-booked-text: #27272a;
      --s-class-bar: #2f6b2c;
      --s-btn-bg: #2f6b2c;
      --s-btn-text: #ffffff;
    }
    @media (prefers-color-scheme: dark) {
      :root {
        --s-bg: #0A101C;
        --s-text: #F5F7F8;
        --s-muted: #b7c1cc;
        --s-line: #2a3546;
        --s-week-bg: #151e2e;
        --s-booked-bg: #2a3343;
        --s-booked-text: #e6eaef;
        --s-class-bar: #CFFF0A;
        --s-btn-bg: #CFFF0A;
        --s-btn-text: #0A101C;
      }
    }
    body { background: var(--s-bg); color: var(--s-text); }
    .site-header { background: var(--s-bg); }
    .sub-nav { display: flex; gap: 16px; align-items: center; }
    .sub-nav a { text-decoration: none; color: var(--s-text); font-weight: 600; }

    .wrap { max-width: 720px; margin: 0 auto; padding: 0 16px 56px; }
    .sched-head { padding: 14px 0 2px; }
    .sched-head h1 { font-size: clamp(1.4rem, 5vw, 2.2rem); margin: 0 0 2px; }
    .sched-head p { margin: 0; color: var(--s-muted); font-size: .9rem; line-height: 1.35; }

    .roster-note { display: flex; gap: 10px; align-items: center; justify-content: space-between;
      border: 2px solid var(--s-line); border-radius: 10px; padding: 8px 10px; margin: 10px 0 2px; font-size: .88rem; }
    .roster-note p { margin: 0; flex: 1; line-height: 1.35; }
    .roster-note a { white-space: nowrap; }

    .week { margin-top: 14px; }
    .week h2 { font-size: .8rem; font-weight: 800; text-transform: uppercase; letter-spacing: .1em;
      background: var(--s-week-bg); color: var(--s-text); margin: 0; padding: 6px 10px; border-radius: 6px; }

    .day { display: grid; grid-template-columns: 46px minmax(0, 1fr); gap: 10px; padding: 5px 0; border-bottom: 1px solid var(--s-line); }
    .day:last-child { border-bottom: 0; }
    .day-label { text-align: center; line-height: 1.05; padding-top: 2px; }
    .day-label b { display: block; font-size: .72rem; text-transform: uppercase; letter-spacing: .06em; color: var(--s-muted); }
    .day-label span { display: block; font-size: 1.15rem; font-weight: 800; }
    .day.today .day-label span { color: var(--s-class-bar); }

    .items { display: flex; flex-direction: column; gap: 4px; }
    .row { display: grid; grid-template-columns: 70px minmax(0, 1fr) auto; align-items: center; gap: 8px;
      min-height: 34px; padding: 4px 8px; border-radius: 7px; font-size: .95rem; line-height: 1.25; }
    .row .time { font-weight: 700; font-variant-numeric: tabular-nums; font-size: .84rem; line-height: 1.15; }
    .row .time span { white-space: nowrap; }

    .row.booked { min-height: 30px; background: var(--s-booked-bg); color: var(--s-booked-text); }
    .row.booked .label { font-weight: 800; text-transform: uppercase; letter-spacing: .08em; font-size: .85rem; grid-column: 2 / 4; }

    .row.class { border: 1px solid var(--s-line); border-left: 5px solid var(--s-class-bar); background: var(--s-bg); }
    .row.class .name { font-weight: 700; }
    .signup { background: var(--s-btn-bg); color: var(--s-btn-text); text-decoration: none; font-weight: 700;
      font-size: .85rem; padding: 6px 12px; border-radius: 999px; white-space: nowrap; }
    .signup.text { background: transparent; color: var(--s-text); border: 2px solid var(--s-class-bar); padding: 5px 10px; }

    .book h2 { font-size: 1.25rem; margin: 36px 0 10px; }
    .offerings { display: grid; grid-template-columns: repeat(auto-fit, minmax(260px, 1fr)); gap: 10px; }
    .offering { border: 1px solid var(--s-line); border-radius: 10px; padding: 12px 14px; display: flex; flex-direction: column; gap: 8px; }
    .offering h3 { margin: 0; font-size: 1.05rem; }
    .prices { display: grid; grid-template-columns: 1fr auto; gap: 2px 10px; margin: 0; font-size: .92rem; }
    .prices dt, .prices dd { margin: 0; }
    .prices dd { font-weight: 700; text-align: right; }
    .offering .signup { align-self: flex-start; }
    .off-detail { margin: 0; font-size: .88rem; color: var(--s-muted); line-height: 1.4; }
    .updated { font-size: .82rem; color: var(--s-muted); margin-top: 22px; }
    .empty { color: var(--s-muted); padding: 18px 0; }

    @media (max-width: 400px) {
      .row { grid-template-columns: 64px minmax(0, 1fr) auto; gap: 6px; padding: 4px 6px; }
      .row .time { font-size: .8rem; }
      .signup { padding: 6px 10px; }
      .day { grid-template-columns: 38px minmax(0, 1fr); gap: 6px; }
    }
  </style>
</head>
<body>
  <header class="site-header">
    <nav class="nav container">
      <a href="../" class="logo">Pickle-Balance</a>
      <div class="sub-nav">
        <a href="../">Home</a>
        <a href="../#contact" class="nav-cta">Contact</a>
      </div>
    </nav>
  </header>

  <main class="wrap">
    <section class="sched-head">
      <h1>Coach Katy&rsquo;s Schedule</h1>
      <p>Classes you can join, and times I&rsquo;m already booked. Open times are free for private lessons.</p>
    </section>

    <div class="roster-note">
      <p><strong>Class not open yet?</strong> Text me and I&rsquo;ll put you on the roster early.</p>
      <a class="signup" id="textBtn" href="sms:+13235169164">Text me</a>
    </div>

    <div id="schedule"><p class="empty">Loading the schedule&hellip;</p></div>

    <section class="book">
      <h2>Book your own time</h2>
      <div class="offerings" id="offerings"></div>
    </section>

    <p class="updated" id="updated"></p>
  </main>

  <footer class="site-footer">
    <div class="container"><p>&copy; <span id="year"></span> Pickle-Balance. Pace yourself.</p></div>
  </footer>

  <script>
  (function () {
    document.getElementById('year').textContent = new Date().getFullYear();
    var DAYS = ['Sun','Mon','Tue','Wed','Thu','Fri','Sat'];
    var MONTHS = ['Jan','Feb','Mar','Apr','May','Jun','Jul','Aug','Sep','Oct','Nov','Dec'];
    function el(tag, cls, text) { var n = document.createElement(tag); if (cls) n.className = cls; if (text != null) n.textContent = text; return n; }
    function d(iso) { var p = iso.split('-'); return new Date(+p[0], +p[1] - 1, +p[2]); }
    function parts(hm) { var p = hm.split(':'), h = +p[0], m = p[1]; return { ap: h >= 12 ? 'PM' : 'AM', s: (h % 12 || 12) + (m === '00' ? '' : ':' + m) }; }
    function range(a, b) {
      var x = parts(a), y = parts(b), n = el('span', 'time');
      if (x.ap === y.ap) { n.appendChild(el('span', null, x.s + '–' + y.s + ' ' + y.ap)); return n; }
      n.appendChild(el('span', null, x.s + ' ' + x.ap + '–'));
      n.appendChild(document.createElement('wbr'));
      n.appendChild(el('span', null, y.s + ' ' + y.ap));
      return n;
    }
    function weekStart(date) { var s = new Date(date); s.setDate(s.getDate() - ((s.getDay() + 6) % 7)); return s; }

    // Join back-to-back blocks so a busy afternoon reads as one "Booked" line,
    // and two back-to-back halves of the same class read as one class.
    function merge(list) {
      var out = [];
      list.slice().sort(function (a, b) { return a.start < b.start ? -1 : 1; }).forEach(function (e) {
        var last = out[out.length - 1];
        var same = last && last.end === e.start && last.kind === e.kind &&
          (e.kind === 'booked' || (last.title === e.title && last.signup === e.signup));
        if (same) { last.end = e.end; } else { out.push(Object.assign({}, e)); }
      });
      return out;
    }

    fetch('schedule.json', { cache: 'no-store' }).then(function (r) { return r.json(); }).then(function (data) {
      var phone = data.contact_phone || '323-516-9164';
      var sms = 'sms:+1' + phone.replace(/\D/g, '');
      document.getElementById('textBtn').href = sms;

      var root = document.getElementById('schedule');
      root.innerHTML = '';
      var now = new Date();
      var todayIso = now.getFullYear() + '-' + String(now.getMonth() + 1).padStart(2, '0') + '-' + String(now.getDate()).padStart(2, '0');
      var events = (data.events || []).filter(function (e) { return e.date >= todayIso; });
      if (!events.length) { root.appendChild(el('p', 'empty', 'No classes posted right now. Text me for the latest.')); }

      var byDay = {};
      events.forEach(function (e) { (byDay[e.date] = byDay[e.date] || []).push(e); });
      var currentWeek = null, weekBox = null;
      Object.keys(byDay).sort().forEach(function (iso) {
        var date = d(iso), ws = weekStart(date), key = ws.toDateString();
        if (key !== currentWeek) {
          currentWeek = key;
          weekBox = el('section', 'week');
          weekBox.appendChild(el('h2', null, 'Week of ' + MONTHS[ws.getMonth()] + ' ' + ws.getDate()));
          root.appendChild(weekBox);
        }
        var row = el('div', 'day' + (iso === todayIso ? ' today' : ''));
        var label = el('div', 'day-label');
        label.appendChild(el('b', null, DAYS[date.getDay()]));
        label.appendChild(el('span', null, String(date.getDate())));
        row.appendChild(label);
        var items = el('div', 'items');
        merge(byDay[iso]).forEach(function (e) {
          if (e.kind === 'booked') {
            var b = el('div', 'row booked');
            b.appendChild(range(e.start, e.end));
            b.appendChild(el('span', 'label', 'Booked'));
            items.appendChild(b);
            return;
          }
          var c = el('div', 'row class');
          c.appendChild(range(e.start, e.end));
          c.appendChild(el('span', 'name', e.title));
          var a;
          if (e.signup) {
            a = el('a', 'signup', 'Sign up'); a.href = e.signup; a.target = '_blank'; a.rel = 'noopener';
          } else {
            a = el('a', 'signup text', 'Text me'); a.href = sms;
          }
          c.appendChild(a);
          items.appendChild(c);
        });
        row.appendChild(items);
        weekBox.appendChild(row);
      });

      var off = document.getElementById('offerings');
      (data.offerings || []).forEach(function (o) {
        var box = el('div', 'offering');
        box.appendChild(el('h3', null, o.title));
        if (o.detail) box.appendChild(el('p', 'off-detail', o.detail));
        if (o.prices && o.prices.length) {
          var list = el('dl', 'prices');
          o.prices.forEach(function (pr) { list.appendChild(el('dt', null, pr[0])); list.appendChild(el('dd', null, pr[1])); });
          box.appendChild(list);
        }
        if (o.note) box.appendChild(el('p', 'off-detail', o.note));
        var b = el('a', 'signup', 'Text to book');
        b.href = sms + (o.sms_body ? '?&body=' + encodeURIComponent(o.sms_body) : '');
        box.appendChild(b);
        off.appendChild(box);
      });
      if (data.updated) {
        var u = new Date(data.updated);
        document.getElementById('updated').textContent = 'Updated ' + MONTHS[u.getMonth()] + ' ' + u.getDate() + ' · Times are Eastern.';
      }
    }).catch(function () {
      document.getElementById('schedule').innerHTML = '<p class="empty">The schedule couldn\'t load. Text 323-516-9164 for the latest times.</p>';
    });
  })();
  </script>
</body>
</html>
